<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">One-Year Development Timeline for a Remote Instrument Lesson Platform</title>
  <desc id="desc">A 12-month roadmap split into four quarters: validation, alpha, pilot, and beta launch preparation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6fb1ff"/>
      <stop offset="100%" stop-color="#0a84ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5b6f95" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="780" rx="36" fill="url(#bg)"/>
  <text x="80" y="92" fill="#1d1d1f" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">
    One-Year Timeline: Remote Music Lesson Platform
  </text>
  <text x="80" y="132" fill="#5f6b7a" font-family="Arial, Helvetica, sans-serif" font-size="22">
    Goal: move from technical prototype to a real small-scale pilot within 12 months
  </text>

  <rect x="80" y="180" width="1440" height="18" rx="9" fill="#dbe7f7"/>
  <rect x="80" y="180" width="1440" height="18" rx="9" fill="url(#bar)"/>

  <g fill="#425466" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
    <text x="80" y="166">Month 1</text>
    <text x="197" y="166">2</text>
    <text x="317" y="166">3</text>
    <text x="437" y="166">4</text>
    <text x="557" y="166">5</text>
    <text x="677" y="166">6</text>
    <text x="797" y="166">7</text>
    <text x="917" y="166">8</text>
    <text x="1037" y="166">9</text>
    <text x="1150" y="166">10</text>
    <text x="1278" y="166">11</text>
    <text x="1398" y="166">12</text>
  </g>

  <g fill="#b8c8df">
    <rect x="438" y="170" width="2" height="38"/>
    <rect x="798" y="170" width="2" height="38"/>
    <rect x="1158" y="170" width="2" height="38"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="248" width="330" height="210" rx="28" fill="#ffffff"/>
    <rect x="440" y="248" width="330" height="210" rx="28" fill="#ffffff"/>
    <rect x="800" y="248" width="330" height="210" rx="28" fill="#ffffff"/>
    <rect x="1160" y="248" width="360" height="210" rx="28" fill="#ffffff"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="112" y="294" fill="#0a84ff" font-size="20" font-weight="700">Q1  Validate the problem</text>
    <text x="112" y="332" fill="#1d1d1f" font-size="26" font-weight="700">Months 1-3</text>
    <text x="112" y="370" fill="#495869" font-size="22">Interview teachers and students</text>
    <text x="112" y="402" fill="#495869" font-size="22">Document pain points in Zoom/FaceTime</text>
    <text x="112" y="434" fill="#495869" font-size="22">Define audio quality success metrics</text>

    <text x="472" y="294" fill="#0a84ff" font-size="20" font-weight="700">Q2  Build the alpha product</text>
    <text x="472" y="332" fill="#1d1d1f" font-size="26" font-weight="700">Months 4-6</text>
    <text x="472" y="370" fill="#495869" font-size="22">Improve the music-focused audio pipeline</text>
    <text x="472" y="402" fill="#495869" font-size="22">Build teacher/student lesson room</text>
    <text x="472" y="434" fill="#495869" font-size="22">Test basic real-time class flow</text>

    <text x="832" y="294" fill="#0a84ff" font-size="20" font-weight="700">Q3  Run a closed pilot</text>
    <text x="832" y="332" fill="#1d1d1f" font-size="26" font-weight="700">Months 7-9</text>
    <text x="832" y="370" fill="#495869" font-size="22">Invite a few real users</text>
    <text x="832" y="402" fill="#495869" font-size="22">Collect lesson feedback and bug reports</text>
    <text x="832" y="434" fill="#495869" font-size="22">Reduce echo, friction, and instability</text>

    <text x="1192" y="294" fill="#0a84ff" font-size="20" font-weight="700">Q4  Prepare small launch</text>
    <text x="1192" y="332" fill="#1d1d1f" font-size="26" font-weight="700">Months 10-12</text>
    <text x="1192" y="370" fill="#495869" font-size="22">Package a recommended lesson setup</text>
    <text x="1192" y="402" fill="#495869" font-size="22">Test pricing and onboarding flow</text>
    <text x="1192" y="434" fill="#495869" font-size="22">Launch a limited beta to early adopters</text>
  </g>

  <g>
    <rect x="80" y="520" width="1440" height="180" rx="30" fill="#ffffff" filter="url(#shadow)"/>
    <text x="116" y="570" fill="#1d1d1f" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">
      Year-end target
    </text>
    <text x="116" y="615" fill="#495869" font-family="Arial, Helvetica, sans-serif" font-size="23">
      A small but real remote lesson platform with music-focused audio, a working teacher/student room,
    </text>
    <text x="116" y="648" fill="#495869" font-family="Arial, Helvetica, sans-serif" font-size="23">
      feedback from real users, a recommended hardware setup, and a limited beta launch plan.
    </text>
  </g>
</svg>
